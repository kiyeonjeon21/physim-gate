name: release

# Publishes to PyPI with trusted publishing (no API token is stored anywhere).
# Runs when a GitHub release is published. The "pypi" environment must exist in the repository
# settings and be registered as a trusted publisher on pypi.org; see CONTRIBUTING.md.
# A manual run publishes to TestPyPI instead, through the "testpypi" environment.
# Nothing is published unless every CI job passes on the released commit.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Install the wheel into a clean environment and run the demo
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/physim-gate demo --output-dir /tmp/demo
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/physim-gate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/physim-gate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
